[project]
name = "multiagentic-becas"
version = "0.1.0"
description = "Multi-agent AI scholarship finder — AMD Developer Hackathon 2026, Track 1: AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Orquestación de agentes
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    # LLM / Inferencia
    "openai>=1.0.0",
    "ollama",
    # RAG / Embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
    "tiktoken",
    # Web Search & Scraping
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "lxml",
    # Procesamiento de documentos
    "pypdf>=4.0.0",
    "python-docx",
    # Schemas y validación
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Frontend
    "streamlit>=1.35.0",
    "streamlit-extras",
    # Utilidades
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tenacity>=8.3.0",
    "rich",
]

[project.scripts]
becas-api = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
